name: E2E Tests

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Web proxies same-origin /api/* to the local API. The API (started by the
      # Playwright webServer) uses dev auth and a throwaway SQLite database.
      API_ORIGIN: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Set up uv (Python)
        uses: astral-sh/setup-uv@v5

      - name: Install API dependencies + Chromium (local PDF rendering)
        run: cd apps/api && uv sync --frozen && uv run playwright install --with-deps chromium

      - name: Install Playwright Chromium (test runner)
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (videos + traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
