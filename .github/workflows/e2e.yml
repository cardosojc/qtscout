name: E2E Tests

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # e2e setup seeds the test profile via the Supabase service role (DB only)
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Web proxies same-origin /api/* to the local API
      API_ORIGIN: http://localhost:3001
      # FastAPI backend (started by the Playwright webServer). No Cloudflare
      # Access on localhost: dev auth mode, as the e2e test user.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      AUTH_MODE: dev
      AUTH_DEV_EMAIL: e2e-test@qtscout.test
      WEB_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Set up uv (Python)
        uses: astral-sh/setup-uv@v5

      - name: Install API dependencies + Chromium (PDF)
        run: cd apps/api && uv sync --frozen && uv run playwright install --with-deps chromium

      - name: Install Playwright Chromium (test runner)
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (videos + traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
