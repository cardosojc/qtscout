[project]
name = "qtscout-api"
version = "0.1.0"
description = "QTScout backend API (FastAPI). Meeting minutes + document management for Agrupamento 61 - Santa Maria dos Olivais (CNE)."
requires-python = ">=3.13"
# What runs inside the Python Worker (bundled by pywrangler). Keep it lean:
# every package is loaded into the Worker's memory snapshot.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "pyjwt[crypto]>=2.10",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    # Local dev server + HTTP client (the Worker uses its runtime fetch instead).
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    # Python Workers CLI + runtime type stubs.
    "workers-py",
    "workers-runtime-sdk",
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "anyio>=4.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Inline HTML/CSS string builders — long literal lines are unavoidable.
"src/app/pdf/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Pyodide / Workers runtime modules only exist inside the Worker.
module = ["js", "pyodide.*", "workers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false
